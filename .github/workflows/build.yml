
name: Build V380 TV APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Check Repository Structure
        run: |
          echo "=== BRANCH ==="
          git branch --show-current
          echo "=== COMMIT ==="
          git log -1 --oneline
          echo "=== ROOT FILES ==="
          ls -la
          echo "=== APP FILES ==="
          ls -la app
          echo "=== ANDROID FILES ==="
          find app -maxdepth 5 -type f -print
          echo "=== APP BUILD GRADLE ==="
          if [ -f app/build.gradle ]; then
            cat app/build.gradle
          else
            echo "ERROR: app/build.gradle NOT FOUND"
            exit 1
          fi

      - name: Install Android SDK
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)
          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found"
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Verify Gradle Android Tasks
        run: |
          gradle projects
          gradle :app:tasks --all

      - name: Build APK
        run: gradle :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: V380-TV-APK
          path: app/build/outputs/apk/debug/app-debug.apk
